name: Deploy

# Mirrors the manual "ssh in, git pull" process this repo used before — just
# automated. Pushing to main pulls the latest commit on the server and
# restarts both systemd services so the new code actually takes effect.
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # lets you trigger a redeploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code and restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/bymr-mr2-map-viewer
            git fetch origin main
            git reset --hard origin/main
            sudo systemctl restart bymr-mr2-poller bymr-mr2-server
            sudo systemctl --no-pager status bymr-mr2-poller bymr-mr2-server
